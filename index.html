<!doctype html>
<html lang="en">
<head>

<title>GraphPaper – SAT & ACT Math Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe4;--ink:#14204a;--mut:#5d6580;--card:#fffdf7;--line:#d8d1bd;--blue:#3d5af1;--ok:#1f9d74;--no:#e5533a;--hi:#d9f23f;--grid:rgba(20,32,74,.06)}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;line-height:1.5}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:2px solid var(--ink)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo span{background:var(--hi);color:#12263f;padding:0 6px;margin-left:2px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:var(--ink)}
nav button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;font-weight:600}
nav button.on{background:var(--ink);color:var(--bg)}
nav button:hover:not(.on){border-color:var(--line)}
main{max-width:980px;margin:0 auto;padding:24px 16px 120px}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em}h1{font-size:34px;margin:0 0 4px}h2{font-size:22px;margin:24px 0 10px}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:600;box-shadow:3px 3px 0 var(--hi)}.btn:disabled{opacity:.4}
.btn.alt{background:none;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--blue)}
.row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:8px 0}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.q{font-size:19px;margin:0 0 16px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:6px;font-size:16px}
.ch:hover:not([disabled]){border-color:var(--blue)}.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}.ch.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.ex{margin-top:14px;padding:12px;border-left:4px solid var(--hi);background:color-mix(in srgb,var(--hi) 14%,var(--card))}
.tiles{display:flex;flex-wrap:wrap;gap:6px}.tile{width:42px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:5px;font-size:13px}
.tile.solved{background:var(--ok);color:#fff;border-color:var(--ok)}.tile.missed{background:var(--no);color:#fff;border-color:var(--no)}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.plan li{margin:6px 0}
#dfab{position:fixed;right:16px;bottom:16px;z-index:20;background:var(--hi);color:#12263f;border:2px solid #12263f;border-radius:30px;padding:10px 18px;font-weight:800}
#dp{position:fixed;right:16px;bottom:70px;width:min(640px,calc(100vw - 32px));height:min(520px,70vh);background:#fff;border:2px solid var(--ink);border-radius:8px;z-index:19;display:none;flex-direction:column;resize:both;overflow:hidden}
#dp.open{display:flex}#dc{flex:1}
@media(max-width:600px){.row{grid-template-columns:1fr}}

body{overflow-x:hidden}.logo{cursor:pointer}
.full{width:100vw;margin-left:calc(50% - 50vw);padding:60px max(16px,calc(50vw - 490px))}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:28px 0 20px}
.hero h1{font-size:clamp(40px,7vw,70px);line-height:1;font-weight:800;margin:14px 0}
.hero h1 u{text-decoration-color:var(--no);text-decoration-thickness:4px;text-underline-offset:8px}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-size:13px;font-weight:600}
.hero p{font-size:18px;max-width:520px;color:var(--mut)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}
.stats{display:flex;gap:36px;border-top:2px solid var(--ink);padding-top:14px;max-width:440px}.stats b{font:800 30px Fraunces,serif;display:block}.stats span{font-size:13px;color:var(--mut)}
.plot{position:relative;transform:rotate(1.5deg)}.plot svg{width:100%;display:block;border-radius:14px;box-shadow:8px 8px 0 var(--ink)}
.sticker{position:absolute;top:-14px;right:-8px;background:var(--hi);border:2px solid var(--ink);padding:3px 12px;font-weight:800;transform:rotate(4deg);border-radius:6px}
.tick{background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;padding:14px 0}.tick div{display:inline-block;animation:tk 40s linear infinite;font-size:14px;letter-spacing:.08em}.tick i{color:var(--hi);font-style:normal;margin:0 22px}
@keyframes tk{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.tick div{animation:none}}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.three .card{border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}.three h3{font:700 22px Fraunces,serif;margin:6px 0}
.sand{background:#e8e1cc}.dom{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:2px solid var(--ink);border-radius:14px;background:var(--card);overflow:hidden}.dom>div{padding:18px;border-right:1px solid var(--line)}.dom b{font:700 20px Fraunces,serif}.dom em{float:right;font:700 22px Fraunces,serif;font-style:normal}.dom p{margin:6px 0 0;color:var(--mut);font-size:14px}
.navy{background:var(--ink);color:#fff}.navy h2{font-size:34px;margin-top:0}.navy .mut{color:#b8c0dd}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dgrid button{text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px;color:#fff}.dgrid button:hover{background:rgba(255,255,255,.14)}.dgrid small{color:var(--hi);display:block;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:32px;align-items:center}
.end{text-align:center}.end h2{font-size:clamp(30px,5vw,48px)}
footer{background:var(--ink);color:#b8c0dd;padding:28px max(16px,calc(50vw - 490px));font-size:14px}footer b{color:#fff;font:700 20px Fraunces,serif}
#dp{background:#fff}
@media(max-width:700px){.hero,.two{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}}
</style>

<body>
<header><div class="logo" onclick="nav('home')">Graph<span>Paper</span></div><nav id="nav"></nav></header>
<main id="app"></main>
<footer><b>GraphPaper</b><br>Graph it. Then prove it. Not affiliated with College Board, ACT or Desmos.</footer>
<button id="dfab" aria-label="Toggle Desmos calculator">Desmos</button>
<div id="dp"><div id="dc"></div></div>
<script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
<script>
/* ---------- seeded RNG + helpers ---------- */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(r,a,b)=>a+Math.floor(r()*(b-a+1)),sg=r=>r()<.5?-1:1,t=n=>n<0?`− ${-n}`:`+ ${n}`;
const gcd=(a,b)=>b?gcd(b,a%b):a,fr=(a,b)=>{const g=gcd(a,b);return a/g+'/'+b/g};
const shuf=(r,a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mc(r,c,ws){const o=[String(c)];ws.forEach(w=>{w=String(w);if(!o.includes(w))o.push(w)});let k=1;
 while(o.length<4){const v=isNaN(c)?['None of these','Cannot be determined','Both A and B'][k-1]:String(+c+k*(k%2?1:-1)*Math.ceil(k/2));k++;if(!o.includes(v))o.push(v)}
 const ch=shuf(r,o.slice(0,4));return{ch,a:ch.indexOf(String(c))}}
const TR=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]];

/* ---------- question templates: (rng, hard) => [text, correct, wrongs[], explanation] ---------- */
const TP=[
{k:'li',n:'Linear Equations',t:[
 (r,h)=>{const x=R(r,2,9+h*9)*sg(r),a=R(r,2,6+h*5),b=R(r,3,12+h*20);return[`If ${a}x + ${b} = ${a*x+b}, what is the value of x?`,x,[-x,x+1,x-1],`Subtract ${b}, then divide by ${a}: x = ${x}.`]},
 (r,h)=>{const m=R(r,2,6+h*4)*sg(r),d=R(r,1,4),x=R(r,0,6),y=R(r,-5,9);return[`A line passes through (${x}, ${y}) and (${x+d}, ${y+m*d}). What is its slope?`,m,[-m,m+1,m-1],`Slope = Δy/Δx = ${m*d}/${d} = ${m}.`]},
 (r,h)=>{const m=R(r,2,7+h*3)*sg(r),b=R(r,-9,12),p=R(r,1,6);return[`A line with slope ${m} passes through (${p}, ${m*p+b}). What is its y-intercept?`,b,[m*p+b,-b,b+m],`y = ${m}x + b, so ${m*p+b} = ${m*p} + b and b = ${b}.`]},
 (r,h)=>{const a=R(r,2,7+h*3),d=R(r,2,6),c=a*d+R(r,1,5);return[`For what value of k does ${a}(x + ${d}) = kx + ${c} have no solution?`,a,[-a,a+1,a-1],`Expanding gives ${a}x + ${a*d} = kx + ${c}. Equal slopes with different intercepts means no solution, so k = ${a}.`]}]},
{k:'sy',n:'Systems of Equations',t:[
 (r,h)=>{const x=R(r,4,14+h*6),y=R(r,1,x-1);return[`If x + y = ${x+y} and x − y = ${x-y}, what is x?`,x,[y,x+y,x+1],`Add the equations: 2x = ${2*x}, so x = ${x}.`]},
 (r,h)=>{let a,b,d,e;do{a=R(r,1,5);b=R(r,1,5);d=R(r,1,5);e=R(r,1,5)}while(a*e===b*d);const x=R(r,-3,6),y=R(r,-3,6),A=h?x*y:x+y;return[`If ${a}x + ${b}y = ${a*x+b*y} and ${d}x + ${e}y = ${d*x+e*y}, what is ${h?'xy':'x + y'}?`,A,[A+1,A-2,h?x+y:x*y],`Solving the system gives x = ${x}, y = ${y}.`]},
 (r,h)=>{const a=R(r,2,5),b=R(r,2,5),c=R(r,2,9),m=R(r,2,4);return[`The system ${a}x + ${b}y = ${c} and kx + ${b*m}y = ${c*m} has infinitely many solutions. What is k?`,a*m,[a+m,a*m+1,c*m],`The second equation must be ${m} times the first, so k = ${a}·${m} = ${a*m}.`]}]},
{k:'qu',n:'Quadratics',t:[
 (r,h)=>{let p=R(r,-8,8),q=R(r,-8,8);if(p===q||p+q===0)q=p+3;return[`What is the greater solution of x² ${t(-(p+q))}x ${t(p*q)} = 0?`,Math.max(p,q),[Math.min(p,q),-Math.max(p,q),p+q],`Factor: (x ${t(-p)})(x ${t(-q)}) = 0, so x = ${p} or ${q}.`]},
 (r,h)=>{const k=R(r,1,6)*sg(r),c=R(r,1,20);return[`What is the minimum value of y = x² ${t(-2*k)}x ${t(c)}?`,c-k*k,[c,k,c+k*k],`Complete the square: y = (x ${t(-k)})² + (${c-k*k}). The minimum is ${c-k*k}.`]},
 (r,h)=>{const b=2*R(r,2,7+h*5)*sg(r),c=b*b/4;return[`For what value of c does x² ${t(b)}x + c = 0 have exactly one real solution?`,c,[b*b,b/2,-c],`The discriminant b² − 4c must be 0, so c = ${b}²/4 = ${c}.`]},
 (r,h)=>{let p=R(r,-7,7),q=R(r,-7,7);if(p===q)q=p+2;return[`If (x ${t(-p)})(x ${t(-q)}) = 0, what is the sum of the squares of the solutions?`,p*p+q*q,[(p+q)**2,p+q,p*q],`The solutions are ${p} and ${q}: ${p}² + ${q}² = ${p*p+q*q}.`]}]},
{k:'ex',n:'Exponents & Radicals',t:[
 (r,h)=>{const B=R(r,2,5),a=R(r,3,9+h*4),b=R(r,2,8),c=R(r,1,a+b-1);return[`If ${B}<sup>${a}</sup> · ${B}<sup>${b}</sup> ÷ ${B}<sup>${c}</sup> = ${B}<sup>n</sup>, what is n?`,a+b-c,[a+b+c,a*b-c,a+b],`Add exponents when multiplying, subtract when dividing: ${a} + ${b} − ${c} = ${a+b-c}.`]},
 (r,h)=>{const m=[2,3,5,6,7][R(r,0,4)],k=R(r,2,8+h*5);return[`Which expression is equivalent to √${k*k*m}?`,`${k}√${m}`,[`${m}√${k}`,`${k*k}√${m}`,`${k+m}√${m}`],`√${k*k*m} = √(${k*k}·${m}) = ${k}√${m}.`]},
 (r,h)=>{const B=R(r,2,4),n=R(r,2,9);return h?[`If ${B**3}<sup>x</sup> = ${B}<sup>x+${2*n}</sup>, what is 2x?`,2*n,[n,n+2,3*n],`Rewrite ${B**3} as ${B}³: 3x = x + ${2*n}, so x = ${n} and 2x = ${2*n}.`]:[`If ${B*B}<sup>x</sup> = ${B}<sup>x+${n}</sup>, what is x?`,n,[n+1,2*n,n/2],`${B*B}<sup>x</sup> = ${B}<sup>2x</sup>, so 2x = x + ${n} and x = ${n}.`]}]},
{k:'pr',n:'Percent, Ratio & Rates',t:[
 (r,h)=>{const P=[10,20,25,50],a=P[R(r,0,2)],d=P[R(r,0,3)],p=400*R(r,1,5),f=p*(100+a)*(100-d)/10000;return[`A jacket priced at $${p} is marked up ${a}% and then discounted ${d}%. What is the final price in dollars?`,f,[p*(100+a-d)/100,p,f+10],`${p} × ${1+a/100} × ${1-d/100} = ${f}. Percent changes multiply; they do not add.`]},
 (r,h)=>{const a=R(r,2,7),b=R(r,a+1,9),k=R(r,2,9+h*8);return[`The ratio of boys to girls is ${a}:${b}. If there are ${(a+b)*k} students in total, how many are girls?`,b*k,[a*k,b*k+k,(a+b)*k-k],`Each ratio part is ${(a+b)*k}/${a+b} = ${k}, so girls = ${b}·${k} = ${b*k}.`]},
 (r,h)=>{const q=R(r,3,12+h*8),a=R(r,2,6),b=R(r,a+1,12);return[`A machine makes ${q*a} units in ${a} hours at a constant rate. How many units does it make in ${b} hours?`,q*b,[q*a+b,q*b+q,q*a*b],`Rate = ${q} units/hour, so ${b} hours gives ${q*b}.`]}]},
{k:'fn',n:'Functions',t:[
 (r,h)=>{const a=R(r,1,4)*sg(r),b=R(r,-6,6),c=R(r,-9,9),n=R(r,-3,4),f=a*n*n+b*n+c;return[`If f(x) = ${a}x² ${t(b)}x ${t(c)}, what is f(${n})?`,f,[f-c,f+a,-f],`Substitute x = ${n}: ${a}(${n*n}) + ${b*n} + ${c} = ${f}.`]},
 (r,h)=>{const a=R(r,2,5),b=R(r,-5,5),c=R(r,1,3),d=R(r,-4,6),n=R(r,1,4),g=c*n*n+d;return[`If f(x) = ${a}x ${t(b)} and g(x) = ${c}x² ${t(d)}, what is f(g(${n}))?`,a*g+b,[c*(a*n+b)**2+d,g,a*n+b+g],`g(${n}) = ${g}, then f(${g}) = ${a*g+b}.`]},
 (r,h)=>{const k=R(r,2,6)*sg(r),b=R(r,-8,8);return[`The linear function f satisfies f(1) = ${k+b} and f(3) = ${3*k+b}. What is f(5)?`,5*k+b,[4*k+b,3*k+b+2,6*k+2*b],`Slope = ${k}, so f(5) = f(3) + 2·${k} = ${5*k+b}.`]}]},
{k:'ge',n:'Geometry & Trigonometry',t:[
 (r,h)=>{const[a,b,c]=TR[R(r,0,3)],k=R(r,1,4+h*3);return h?[`A right triangle has hypotenuse ${c*k} and one leg ${a*k}. What is the other leg?`,b*k,[c*k-a*k,b*k+1,a*k+b*k],`√(${c*k}² − ${a*k}²) = ${b*k}.`]:[`A right triangle has legs ${a*k} and ${b*k}. What is its hypotenuse?`,c*k,[a*k+b*k,c*k+1,c*k-1],`√(${a*k}² + ${b*k}²) = ${c*k}.`]},
 (r,h)=>{const x=R(r,2,12+h*8);return[`A circle has area ${x*x}π. What is its circumference?`,`${2*x}π`,[`${x*x}π`,`${x}π`,`${4*x*x}π`],`r = ${x}, so C = 2πr = ${2*x}π.`]},
 (r,h)=>{const[a,b,c]=TR[R(r,0,3)],k=R(r,1,5);return[`In right triangle ABC, the right angle is at B, AB = ${b*k}, BC = ${a*k}, and AC = ${c*k}. What is ${h?'tan':'sin'} A?`,h?`${a}/${b}`:`${a}/${c}`,h?[`${b}/${a}`,`${a}/${c}`,`${b}/${c}`]:[`${b}/${c}`,`${a}/${b}`,`${c}/${a}`],h?'tan A = opposite/adjacent = BC/AB.':'sin A = opposite/hypotenuse = BC/AC.']},
 (r,h)=>{const n=h?[6,8,9,10,12,15,18,20][R(r,0,7)]:R(r,5,12);return h?[`What is the measure, in degrees, of each interior angle of a regular polygon with ${n} sides?`,(n-2)*180/n,[(n-2)*180,360/n,(n-2)*180/n+10],`Interior sum = (${n}−2)·180; divide by ${n}.`]:[`What is the sum of the interior angles, in degrees, of a polygon with ${n} sides?`,(n-2)*180,[n*180,(n-1)*180,(n-2)*90],`(n − 2)·180 = ${(n-2)*180}.`]}]},
{k:'st',n:'Statistics & Probability',t:[
 (r,h)=>{const m=R(r,15,30),v=[0,1,2,3].map(()=>R(r,m-6,m+6)),f=5*m-v.reduce((a,b)=>a+b,0);return f<1?[`The mean of 4 numbers is ${m}. If a fifth number equal to ${m} is added, what is the mean of all 5?`,m,[m+1,m-1,2*m],'Adding a value equal to the mean leaves the mean unchanged.']:[`The mean of five numbers is ${m}. Four of them are ${v.join(', ')}. What is the fifth number?`,f,[f+m,f-5,5*m],`Total = 5·${m} = ${5*m}; ${5*m} − ${v.reduce((a,b)=>a+b,0)} = ${f}.`]},
 (r,h)=>{const a=R(r,2,9),b=R(r,2,9),c=R(r,2,9),T=a+b+c;return[`A bag has ${a} red, ${b} blue, and ${c} green marbles. What is the probability a random marble is blue?`,fr(b,T),[fr(b,T-b),fr(b,a),fr(T-b,T)],`P = blue/total = ${b}/${T}, reduced.`]},
 (r,h)=>{const n=h?9:7,s=new Set;while(s.size<n)s.add(R(r,3,60));const v=[...s],so=[...v].sort((x,y)=>x-y),m=so[(n-1)/2];return[`What is the median of ${v.join(', ')}?`,m,[so[(n-1)/2-1],so[(n-1)/2+1],Math.round(v.reduce((x,y)=>x+y,0)/n)],`Sorted: ${so.join(', ')}. The middle value is ${m}.`]},
 (r,h)=>{const n=R(r,4,9),m=R(r,10,20),m2=m+R(r,1,5),v=m+(m2-m)*(n+1);return[`The mean of ${n} numbers is ${m}. After a sixth value... adding the number ${v} to the list, what is the new mean?`.replace('a sixth value... ',''),m2,[v,m+1,(m+v)/2],`New total = ${n*m} + ${v} = ${n*m+v}; divide by ${n+1} to get ${m2}.`]}]}
];
const mk=(T,i,mode,h)=>{const r=rng((T.k.charCodeAt(0)*1000+T.k.charCodeAt(1))*131+i*7919+mode*555555);
 const[q,c,ws,e]=T.t[i%T.t.length](r,h),m=mc(r,c,ws);return{id:`${T.k}${mode}${i}`,k:T.k,q,ch:m.ch,a:m.a,e,lv:mode?(h?'Hard':'Moderate'):'Practice'}};
const PR=TP.flatMap(T=>Array.from({length:45},(_,i)=>mk(T,i,0,i%4===3?1:0)));   // 45 per topic = 360
const BK=TP.flatMap(T=>Array.from({length:45},(_,i)=>mk(T,i,1,i%3?1:0)));       // 360 moderate-to-hard

/* ---------- state ---------- */
let S;try{S=JSON.parse(localStorage.gp)}catch(e){}S=S||{a:{},g:{}};
const save=()=>{try{localStorage.gp=JSON.stringify(S)}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app'),tn=k=>TP.find(x=>x.k===k).n;
const st=id=>S.a[id]?(S.a[id].o?'solved':'missed'):'new';
const tstat=k=>{const e=Object.values(S.a).filter(x=>x.k===k),n=e.length,c=e.reduce((s,x)=>s+x.o,0);return{n,c,acc:n?c/n:null,tm:n?e.reduce((s,x)=>s+x.s,0)/n:0}};
const pct=x=>x==null?'–':Math.round(x*100)+'%';

/* ---------- navigation ---------- */
let view='home',F={k:'all',s:'all'},Q={};
function nav(v){view=v;$('#nav').innerHTML=[['home','Home'],['dash','Dashboard'],['prac','Topic Practice'],['bank','Question Bank'],['plan','Plan Analyzer']].map(([k,l])=>`<button class="${k==v?'on':''}" onclick="nav('${k}')">${l}</button>`).join('');({home,dash,prac,bank,plan})[v]();window.scrollTo(0,0)}

function dash(){const all=Object.values(S.a),n=all.length,c=all.reduce((s,x)=>s+x.o,0),acc=n?c/n:null;
 const est=n>=10?200+Math.round(600*acc/10)*10:null;
 app.innerHTML=`<h1>SAT & ACT Math, topic by topic</h1><p class="mut">${PR.length} practice questions, ${BK.length} bank questions, and a built-in Desmos calculator. Progress is saved in this browser.</p>
 <div class="grid"><div class="card"><div class="big">${n}</div><div class="mut">questions answered</div></div><div class="card"><div class="big">${pct(acc)}</div><div class="mut">overall accuracy</div></div><div class="card"><div class="big">${est||'–'}</div><div class="mut">rough SAT Math estimate (needs 10+ answers)</div></div></div>
 <h2>Accuracy by topic</h2><div class="card">${TP.map(T=>{const s=tstat(T.k);return`<div class="row"><b>${T.n}</b><div class="bar"><i style="width:${(s.acc||0)*100}%"></i></div><span class="mut">${s.n} done · ${pct(s.acc)}</span></div>`}).join('')}</div>
 <p><button class="btn" onclick="nav('plan')">Analyze my weak areas</button></p>`}

function prac(){app.innerHTML=`<h1>Topic practice</h1><p class="mut">45 questions per topic. Open the Desmos button any time.</p><div class="grid">${TP.map(T=>{const l=PR.filter(q=>q.k===T.k),d=l.filter(q=>S.a[q.id]).length,s=tstat(T.k);
 return`<div class="card"><b>${T.n}</b><div class="bar"><i style="width:${d/l.length*100}%"></i></div><div class="mut">${d}/${l.length} attempted · ${pct(s.acc)} correct</div><p><button class="btn" onclick="openQ(PR.filter(q=>q.k==='${T.k}'),'prac',true)">${d?'Continue':'Start'}</button></p></div>`}).join('')}</div>`}

function bank(){const l=BK.filter(q=>(F.k==='all'||q.k===F.k)&&(F.s==='all'||st(q.id)===F.s));
 app.innerHTML=`<h1>Question bank</h1><p class="mut">${BK.length} moderate-to-hard questions. Green = solved, red = missed.</p>
 <div class="top"><span><select onchange="F.k=this.value;bank()" aria-label="Topic"><option value="all">All topics</option>${TP.map(T=>`<option value="${T.k}" ${F.k===T.k?'selected':''}>${T.n}</option>`).join('')}</select>
 <select onchange="F.s=this.value;bank()" aria-label="Status">${['all','new','missed','solved'].map(s=>`<option ${F.s===s?'selected':''}>${s}</option>`).join('')}</select></span><span class="mut">${l.length} shown</span></div>
 <div class="tiles">${l.map((q,i)=>`<button class="tile ${st(q.id)}" title="${tn(q.k)} · ${q.lv}" onclick="openQ(BK.filter(q=>(F.k==='all'||q.k===F.k)&&(F.s==='all'||st(q.id)===F.s)),'bank',${i})">${BK.indexOf(q)+1}</button>`).join('')}</div>`}

/* ---------- quiz ---------- */
function openQ(list,back,i){if(i===true)i=Math.max(0,list.findIndex(q=>!S.a[q.id]));Q={list,back,i,pick:null,t0:Date.now()};quiz()}
function quiz(){const q=Q.list[Q.i],done=Q.pick!=null;
 app.innerHTML=`<div class="top"><button class="btn alt" onclick="nav('${Q.back}')">Back</button><span class="mut">${tn(q.k)} · <span class="tag">${q.lv}</span> · ${Q.i+1} of ${Q.list.length}</span></div>
 <div class="card"><p class="q">${q.q}</p>${q.ch.map((c,j)=>`<button class="ch ${done?(j===q.a?'ok':j===Q.pick?'no':''):''}" ${done?'disabled':''} onclick="pick(${j})">${'ABCD'[j]}. ${c}</button>`).join('')}
 ${done?`<div class="ex"><b>${Q.pick===q.a?'Correct.':'Not quite.'}</b> ${q.e}</div>`:''}</div>
 <div class="top" style="margin-top:12px"><button class="btn alt" ${Q.i?'':'disabled'} onclick="go(-1)">Previous</button><button class="btn" ${Q.i<Q.list.length-1?'':'disabled'} onclick="go(1)">Next question</button></div>`}
function pick(j){if(Q.pick!=null)return;const q=Q.list[Q.i];Q.pick=j;S.a[q.id]={o:j===q.a?1:0,s:Math.min(600,Math.round((Date.now()-Q.t0)/1000)),k:q.k};save();quiz()}
function go(d){Q.i+=d;Q.pick=null;Q.t0=Date.now();quiz()}

/* ---------- plan analyzer ---------- */
function plan(){const rows=TP.map(T=>({T,...tstat(T.k)})),n=rows.reduce((s,r)=>s+r.n,0);
 const weak=rows.filter(r=>r.n>=5&&r.acc<.7).sort((a,b)=>a.acc-b.acc),fresh=rows.filter(r=>r.n<5),strong=rows.filter(r=>r.n>=5&&r.acc>=.7);
 const days=S.g.date?Math.max(1,Math.ceil((new Date(S.g.date)-Date.now())/864e5)):30;
 const need=weak.reduce((s,r)=>s+Math.max(15,45-r.n),0)+fresh.reduce((s,r)=>s+45-r.n,0),daily=Math.min(40,Math.max(10,Math.ceil(need/Math.max(1,days*.6))));
 const slow=rows.filter(r=>r.n>=5&&r.tm>90),missed=BK.filter(q=>st(q.id)==='missed').length+PR.filter(q=>st(q.id)==='missed').length;
 let out='';
 if(n<10)out=`<div class="card">Answer at least 10 questions in Topic Practice and your plan appears here. Right now ${n} are logged.</div>`;
 else out=`<div class="grid"><div class="card"><b>Weak areas</b><p>${weak.length?weak.map(r=>`${r.T.n} (${pct(r.acc)})`).join('<br>'):'None under 70% yet.'}</p></div>
 <div class="card"><b>Not enough data</b><p>${fresh.length?fresh.map(r=>r.T.n).join('<br>'):'Every topic has 5+ attempts.'}</p></div>
 <div class="card"><b>Strengths</b><p>${strong.length?strong.map(r=>`${r.T.n} (${pct(r.acc)})`).join('<br>'):'Keep practicing to build some.'}</p></div></div>
 <h2>Your plan for the next ${days} days</h2><div class="card plan"><ol>
 <li><b>Daily target: ${daily} questions.</b> Spread across the topics below, then re-check this page weekly.</li>
 <li><b>Phase 1 (days 1–${Math.ceil(days*.4)}): fix the foundations.</b> ${weak.concat(fresh).slice(0,3).map(r=>r.T.n).join(', ')||'Do mixed topic practice'}. Read every explanation, then redo what you missed.</li>
 <li><b>Phase 2 (days ${Math.ceil(days*.4)+1}–${Math.ceil(days*.85)}): raise difficulty.</b> Work the Question Bank filtered to your weak topics and aim for 80%+ accuracy.</li>
 <li><b>Phase 3 (final ${days-Math.ceil(days*.85)||1} days): timed review.</b> Re-attempt missed questions (${missed} right now) at about 75 seconds each, and rest the day before the test.</li></ol>
 ${slow.length?`<p>Pacing flag: you average over 90 seconds in ${slow.map(r=>r.T.n).join(', ')}. Practice shortcuts and use Desmos to check answers.</p>`:''}
 <p><button class="btn" onclick="openQ(PR.concat(BK).filter(q=>st(q.id)==='missed'),'plan',0)" ${missed?'':'disabled'}>Review missed questions</button>
 ${weak[0]?`<button class="btn alt" onclick="openQ(BK.filter(q=>q.k==='${weak[0].T.k}'),'plan',true)">Drill ${weak[0].T.n} (bank)</button>`:''}</p></div>`;
 app.innerHTML=`<h1>Plan analyzer</h1><div class="top"><label>Test date <input type="date" value="${S.g.date||''}" onchange="S.g.date=this.value;save();plan()"></label></div>${out}`}

/* ---------- Desmos ---------- */
let calc;$('#dfab').onclick=()=>dm();

function home(){const fx=[['Solve any equation','y=3x+2','y=14'],['Systems, no algebra','y=2x+1','y=-x+7'],['Roots & vertex instantly','y=x^2-6x+5'],['Sliders for unknowns','y=kx+2','k=1']];
 const tk=TP.map(T=>T.n.toUpperCase()).join('<i>✦</i>')+'<i>✦</i>';
 app.innerHTML=`<section class="hero"><div><span class="pill">SAT & ACT · Math</span><h1>Graph your way to an <u>800</u>.</h1>
 <p>Topic-by-topic practice, a ${BK.length}-question bank for the hard stuff, and a Desmos calculator on every page. We track what you miss and build your plan.</p>
 <div class="cta"><button class="btn" onclick="nav('prac')">Start practicing</button><button class="btn alt" onclick="dm(true)">Open Desmos</button></div>
 <div class="stats"><div><b>${TP.length}</b><span>topics</span></div><div><b>${PR.length+BK.length}</b><span>questions</span></div><div><b>1</b><span>smart plan</span></div></div></div>
 <div class="plot"><svg viewBox="0 0 360 300" role="img" aria-label="A parabola, a line and a circle on a graph"><defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".1"/></pattern></defs><rect width="360" height="300" fill="#14204a"/><rect width="360" height="300" fill="url(#g)"/><path d="M0 150H360M120 0V300" stroke="#fff" stroke-opacity=".5"/><path d="M110 40Q180 420 250 40" fill="none" stroke="#d9f23f" stroke-width="3.5"/><path d="M20 260L340 50" stroke="#fff" stroke-width="2.5"/><circle cx="250" cy="190" r="48" fill="none" stroke="#e5533a" stroke-width="3.5"/></svg><div class="sticker">(x − 3)² − 4</div></div></section>
 <div class="tick full" style="padding-top:14px;padding-bottom:14px"><div>${tk+tk+tk+tk}</div></div>
 <section class="full"><h2>Practice it. Graph it. Fix it.</h2><div class="three">
 <div class="card"><h3>Practice</h3><p class="mut">45 questions per topic, each with a worked explanation. Start easy and build speed.</p></div>
 <div class="card"><h3>Graph</h3><p class="mut">Desmos opens beside any question, the same calculator built into the digital SAT.</p></div>
 <div class="card"><h3>Improve</h3><p class="mut">The plan analyzer spots weak topics and gives a day-by-day schedule to your test date.</p></div></div></section>
 <section class="full sand"><h2>Four domains. One study plan.</h2><div class="dom">
 <div><em>≈35%</em><b>Algebra</b><p>${tn('li')}, ${tn('sy')}</p></div><div><em>≈35%</em><b>Advanced Math</b><p>${tn('qu')}, ${tn('ex')}, ${tn('fn')}</p></div>
 <div><em>≈15%</em><b>Problem Solving & Data</b><p>${tn('pr')}, ${tn('st')}</p></div><div><em>≈15%</em><b>Geometry & Trig</b><p>${tn('ge')}</p></div></div>
 <p><button class="btn" onclick="nav('bank')">Browse the question bank</button></p></section>
 <section class="full navy"><div class="two"><div><h2>The calculator is the cheat code. (It's allowed.)</h2><p class="mut">Desmos is built into the real digital SAT. Try these, then use it on your practice questions.</p><button class="btn" style="background:var(--hi);color:#14204a;box-shadow:3px 3px 0 #fff" onclick="dm(true)">Open Desmos</button></div>
 <div class="dgrid">${fx.map(f=>`<button onclick='dm(true,${JSON.stringify(f.slice(1))})'><b>${f[0]}</b><small>Load in Desmos</small></button>`).join('')}</div></div></section>
 <section class="full end"><h2>Your first set takes ten minutes.</h2><p class="mut">Start with linear equations, the most common question type.</p><button class="btn" onclick="openQ(PR.filter(q=>q.k==='li'),'prac',true)">Start learning free</button></section>`}
function dm(open,ex){const p=$('#dp');open===true?p.classList.add('open'):p.classList.toggle('open');
 if(p.classList.contains('open')){if(!calc&&window.Desmos)calc=Desmos.GraphingCalculator($('#dc'),{keypad:true});else if(calc)calc.resize();
 if(ex&&calc){calc.setBlank();ex.forEach((l,i)=>calc.setExpression({id:'e'+i,latex:l}))}}}
nav('home');
</script>
</body>
</html>
